<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浩记 · AI 密钥管家 · 安全增强版</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #232340;
    --border: #2d2d50;
    --primary: #6c63ff;
    --primary-hover: #5a52e0;
    --primary-glow: rgba(108, 99, 255, 0.25);
    --text: #e8e8f0;
    --text2: #9898b8;
    --danger: #ff4757;
    --success: #2ed573;
    --warning: #ffa502;
    --radius: 12px;
    --shadow: 0 8px 32px rgba(0,0,0,0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text2); }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--primary), #a855f7);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .logo span { color: var(--text2); font-weight: 400; font-size: 14px; }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  /* Buttons */
  .btn {
    padding: 8px 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--primary); background: rgba(108,99,255,0.1); }
  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 0 20px var(--primary-glow); }
  .btn-danger { border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background: rgba(255,71,87,0.1); }
  .btn-success { border-color: var(--success); color: var(--success); }
  .btn-success:hover { background: rgba(46,213,115,0.1); }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn-icon { width: 34px; height: 34px; padding: 0; justify-content: center; }

  /* Main Layout */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* Stats Bar */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
  }
  .stat-card .num {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--primary), #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stat-card .label { font-size: 12px; color: var(--text2); margin-top: 2px; }

  /* Toolbar */
  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    align-items: center;
  }
  .search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
  }
  .search-box input:focus { border-color: var(--primary); }
  .search-box .icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text2);
    font-size: 16px;
  }
  .filter-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--primary); color: var(--text); }
  .filter-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  /* Vault Grid */
  .vault-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
  }
  .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state h3 { font-size: 18px; margin-bottom: 6px; color: var(--text); }
  .empty-state p { font-size: 13px; }

  /* Key Card */
  .key-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .key-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    background: var(--primary);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .key-card:hover { border-color: var(--primary); box-shadow: 0 4px 20px rgba(108,99,255,0.08); }
  .key-card:hover::before { opacity: 1; }
  .key-card .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .key-card .platform {
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .key-card .platform .badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(108,99,255,0.15);
    color: var(--primary);
    font-weight: 500;
  }
  .key-card .actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .key-card:hover .actions { opacity: 1; }
  .key-card .key-value {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    color: var(--text2);
    background: var(--bg);
    padding: 8px 12px;
    border-radius: 6px;
    word-break: break-all;
    cursor: pointer;
    position: relative;
    margin-bottom: 8px;
    border: 1px solid transparent;
    transition: border 0.2s;
  }
  .key-card .key-value:hover { border-color: var(--border); }
  .key-card .key-value .masked {
    filter: blur(4px);
    user-select: none;
    transition: filter 0.3s;
  }
  .key-card .key-value .masked.revealed { filter: none; }
  .key-card .meta {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: var(--text2);
    flex-wrap: wrap;
  }
  .key-card .meta span { display: flex; align-items: center; gap: 4px; }
  .key-card .note {
    font-size: 12px;
    color: var(--text2);
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }
  .key-card .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
  }
  .status-dot.online { background: var(--success); }
  .status-dot.offline { background: var(--danger); }
  .status-dot.unknown { background: var(--text2); }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 999;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 32px;
    width: 90%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
  }
  .modal h2 { font-size: 20px; margin-bottom: 20px; }
  .modal .form-group { margin-bottom: 16px; }
  .modal label {
    display: block;
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 4px;
  }
  .modal input, .modal select, .modal textarea {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--primary); }
  .modal textarea { resize: vertical; min-height: 60px; font-family: inherit; }
  .modal .btn-row {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
  }
  .modal .password-strength {
    height: 3px;
    border-radius: 2px;
    margin-top: 6px;
    background: var(--border);
    overflow: hidden;
  }
  .modal .password-strength .bar {
    height: 100%;
    width: 0%;
    transition: all 0.3s;
    border-radius: 2px;
  }

  /* Toast */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast {
    padding: 12px 20px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    box-shadow: var(--shadow);
    animation: slideIn 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 240px;
  }
  .toast.success { border-left: 3px solid var(--success); }
  .toast.error { border-left: 3px solid var(--danger); }
  .toast.info { border-left: 3px solid var(--primary); }
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* Unlock Screen */
  .unlock-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .unlock-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .unlock-card .lock-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .unlock-card h1 { font-size: 24px; margin-bottom: 4px; }
  .unlock-card p { color: var(--text2); font-size: 14px; margin-bottom: 24px; }
  .unlock-card input {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    outline: none;
    margin-bottom: 12px;
    text-align: center;
  }
  .unlock-card input:focus { border-color: var(--primary); }
  .unlock-card .btn { width: 100%; justify-content: center; padding: 12px; font-size: 15px; }
  .unlock-card .sub-action {
    margin-top: 16px;
    font-size: 13px;
    color: var(--text2);
  }
  .unlock-card .sub-action a {
    color: var(--primary);
    cursor: pointer;
    text-decoration: none;
  }
  .unlock-card .sub-action a:hover { text-decoration: underline; }

  /* Responsive */
  @media (max-width: 768px) {
    .container { padding: 16px; }
    .header { padding: 12px 16px; }
    .header .logo span { display: none; }
    .vault-grid { grid-template-columns: 1fr; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .modal { padding: 20px; }
    .toolbar { flex-direction: column; }
    .search-box { min-width: 100%; }
  }

  /* Loading spinner */
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Tag pills */
  .tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
  }
  .tag-general { background: rgba(108,99,255,0.12); color: #8b83ff; }
  .tag-coding { background: rgba(46,213,115,0.12); color: #2ed573; }
  .tag-drawing { background: rgba(255,165,2,0.12); color: #ffa502; }
  .tag-work { background: rgba(255,71,87,0.12); color: #ff6b81; }
  .tag-personal { background: rgba(165,105,245,0.12); color: #a569f5; }
  .tag-other { background: rgba(152,152,184,0.12); color: #9898b8; }

  /* Bulk bar */
  .bulk-bar {
    display: none;
    background: var(--surface);
    border: 1px solid var(--primary);
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 12px;
    align-items: center;
    justify-content: space-between;
  }
  .bulk-bar.show { display: flex; }
  .bulk-bar .count { font-size: 13px; }
  .bulk-bar .actions { display: flex; gap: 6px; }

  /* Sort dropdown */
  .sort-select {
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
    outline: none;
    cursor: pointer;
  }
  .sort-select:focus { border-color: var(--primary); }
</style>
</head>
<body>

<!-- Unlock Screen -->
<div class="unlock-screen" id="unlockScreen">
  <div class="unlock-card">
    <div class="lock-icon">🔐</div>
    <h1>浩记 · AI 密钥管家</h1>
    <p>安全增强版 · AES-GCM 本地加密 · 闲置 5 分钟自动锁定</p>
    <input type="password" id="masterPasswordInput" placeholder="请输入主密码" autocomplete="current-password" />
    <button class="btn btn-primary" onclick="unlockVault()">解锁保险箱</button>
    <div class="sub-action">
      首次使用？<a onclick="showCreateMaster()">创建保险箱</a>
    </div>
  </div>
</div>

<!-- Create Master Password Screen -->
<div class="unlock-screen" id="createScreen" style="display:none;">
  <div class="unlock-card">
    <div class="lock-icon">🛡️</div>
    <h1>创建保险箱</h1>
    <p>设置至少 12 位的强主密码。忘记密码无法恢复数据。</p>
    <input type="password" id="newMasterPassword" placeholder="至少 12 位，建议使用密码短语" autocomplete="new-password" />
    <div class="password-strength" style="margin:-8px 0 12px"><div class="bar" id="strengthBar"></div></div>
    <input type="password" id="confirmMasterPassword" placeholder="再次输入主密码" autocomplete="new-password" />
    <button class="btn btn-primary" onclick="createMaster()">创建保险箱</button>
    <div class="sub-action">
      <a onclick="backToUnlock()">返回</a>
    </div>
  </div>
</div>

<!-- Main App -->
<div id="mainApp" style="display:none;">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🔑</div>
      <div>浩记 · 密钥管家 <span>终极版</span></div>
    </div>
    <div class="header-actions">
      <button class="btn btn-sm" onclick="exportBackup()">🔐 导出加密备份</button>
      <button class="btn btn-sm" onclick="document.getElementById('importFile').click()">📥 导入备份</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(event)" />
      <button class="btn btn-sm btn-danger" onclick="lockVault()">🔒 锁定</button>
    </div>
  </div>

  <div class="container">
    <div style="margin-bottom:16px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text2);font-size:12px;">🛡️ 密钥在本地加密保存。连接测试会把对应 API Key 发送到你填写的 Base URL；请仅使用可信的 HTTPS 地址。建议定期导出加密备份。</div>
    <!-- Stats -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">密钥总数</div></div>
      <div class="stat-card"><div class="num" id="statPlatforms">0</div><div class="label">平台数量</div></div>
      <div class="stat-card"><div class="num" id="statTested">0</div><div class="label">已验证连通</div></div>
      <div class="stat-card"><div class="num" id="statGroups">0</div><div class="label">分组数</div></div>
    </div>

    <!-- Bulk Bar -->
    <div class="bulk-bar" id="bulkBar">
      <span class="count">已选 <strong id="bulkCount">0</strong> 项</span>
      <div class="actions">
        <button class="btn btn-sm btn-success" onclick="batchTest()">🧪 批量测试</button>
        <button class="btn btn-sm btn-danger" onclick="batchDelete()">🗑️ 批量删除</button>
        <button class="btn btn-sm" onclick="clearSelection()">取消选择</button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索平台名称、备注..." oninput="renderVault()" />
      </div>
      <div class="filter-group" id="filterGroup">
        <button class="filter-btn active" data-group="" onclick="setFilter(this, '')">全部</button>
        <button class="filter-btn" data-group="general" onclick="setFilter(this,'general')">通用</button>
        <button class="filter-btn" data-group="coding" onclick="setFilter(this,'coding')">编程</button>
        <button class="filter-btn" data-group="drawing" onclick="setFilter(this,'drawing')">绘图</button>
        <button class="filter-btn" data-group="work" onclick="setFilter(this,'work')">工作</button>
        <button class="filter-btn" data-group="personal" onclick="setFilter(this,'personal')">个人</button>
        <button class="filter-btn" data-group="other" onclick="setFilter(this,'other')">其他</button>
      </div>
      <select class="sort-select" id="sortSelect" onchange="renderVault()">
        <option value="newest">最新添加</option>
        <option value="oldest">最早添加</option>
        <option value="alpha">名称 A-Z</option>
        <option value="tested">已验证优先</option>
      </select>
      <button class="btn btn-primary" onclick="showAddModal()">＋ 添加密钥</button>
    </div>

    <!-- Vault Grid -->
    <div class="vault-grid" id="vaultGrid"></div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="keyModal">
  <div class="modal">
    <h2 id="modalTitle">添加密钥</h2>
    <div class="form-group">
      <label>平台 / 服务名称 *</label>
      <input type="text" id="keyPlatform" placeholder="如 OpenAI、Claude、Azure..." />
    </div>
    <div class="form-group">
      <label>API Key *</label>
      <input type="text" id="keyValue" placeholder="sk-..." />
    </div>
    <div class="form-group">
      <label>API Base URL（可选）</label>
      <input type="text" id="keyBaseUrl" placeholder="https://api.openai.com/v1" />
    </div>
    <div class="form-group">
      <label>分组</label>
      <select id="keyGroup">
        <option value="general">通用</option>
        <option value="coding">编程</option>
        <option value="drawing">绘图</option>
        <option value="work">工作</option>
        <option value="personal">个人</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div class="form-group">
      <label>备注（可选）</label>
      <textarea id="keyNote" placeholder="用途、限额、到期日等"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="closeModal('keyModal')">取消</button>
      <button class="btn btn-primary" onclick="saveKey()">加密保存</button>
    </div>
  </div>
</div>

<!-- Test Result Modal -->
<div class="modal-overlay" id="testModal">
  <div class="modal" style="max-width:560px;">
    <h2>连通性测试结果</h2>
    <div id="testResults" style="max-height:400px;overflow-y:auto;"></div>
    <div class="btn-row">
      <button class="btn" onclick="closeModal('testModal')">关闭</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ============================================================
// Crypto Utilities (AES-GCM via Web Crypto API)
// ============================================================
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password),
    { name: 'PBKDF2' }, false, ['deriveBits', 'deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 350000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false, ['encrypt', 'decrypt']
  );
}

async function encryptData(plaintext, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv },
    key, enc.encode(JSON.stringify(plaintext))
  );
  // Combine salt + iv + ciphertext -> base64
  const combined = new Uint8Array(salt.length + iv.length + ciphertext.byteLength);
  combined.set(salt, 0);
  combined.set(iv, salt.length);
  combined.set(new Uint8Array(ciphertext), salt.length + iv.length);
  let binary = '';
  const chunkSize = 0x8000;
  for (let i = 0; i < combined.length; i += chunkSize) {
    binary += String.fromCharCode(...combined.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

async function decryptData(base64Str, password) {
  try {
    const raw = Uint8Array.from(atob(base64Str), c => c.charCodeAt(0));
    const salt = raw.slice(0, 16);
    const iv = raw.slice(16, 28);
    const ciphertext = raw.slice(28);
    const key = await deriveKey(password, salt);
    const decrypted = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv },
      key, ciphertext
    );
    return JSON.parse(new TextDecoder().decode(decrypted));
  } catch(e) {
    throw new Error('解密失败：密码错误或数据已损坏');
  }
}

let state = {
  masterPassword: '',
  keys: [],
  filter: '',
  searchQuery: '',
  selected: new Set(),
  editIndex: -1,
};

let autoLockTimer = null;
const AUTO_LOCK_MS = 5 * 60 * 1000;
function resetAutoLock() {
  if (!state.masterPassword) return;
  clearTimeout(autoLockTimer);
  autoLockTimer = setTimeout(() => lockVault(), AUTO_LOCK_MS);
}
['pointerdown','keydown','touchstart'].forEach(evt => document.addEventListener(evt, () => {
  if (state.masterPassword) resetAutoLock();
}, { passive: true }));
function normalizeEntry(k) {
  return {
    id: String(k.id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8))),
    platform: String(k.platform || '未命名平台'), key: String(k.key || ''),
    baseUrl: String(k.baseUrl || ''), group: ['general','coding','drawing','work','personal','other'].includes(k.group) ? k.group : 'other',
    note: String(k.note || ''), createdAt: k.createdAt || new Date().toISOString(),
    updatedAt: k.updatedAt || k.createdAt || new Date().toISOString(),
    tested: Boolean(k.tested), testTime: k.testTime || null
  };
}

function showCreateMaster() {
  document.getElementById('unlockScreen').style.display = 'none';
  document.getElementById('createScreen').style.display = 'flex';
}

function backToUnlock() {
  document.getElementById('createScreen').style.display = 'none';

}

// Password strength
document.addEventListener('DOMContentLoaded', () => {
  const pwInput = document.getElementById('newMasterPassword');
  if (pwInput) {
    pwInput.addEventListener('input', () => {
      const val = pwInput.value;
      const bar = document.getElementById('strengthBar');
      let score = 0;
      if (val.length >= 8) score += 25;
      if (val.length >= 12) score += 15;
      if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score += 20;
      if (/\d/.test(val)) score += 20;
      if (/[^a-zA-Z0-9]/.test(val)) score += 20;
      bar.style.width = Math.min(score, 95) + '%';
      if (score < 30) { bar.style.background = '#ff4757'; }
      else if (score < 55) { bar.style.background = '#ffa502'; }
      else if (score < 75) { bar.style.background = '#2ed573'; }
      else { bar.style.background = '#6c63ff'; }
    });
  }
});

async function createMaster() {
  const pw = document.getElementById('newMasterPassword').value;
  const confirm = document.getElementById('confirmMasterPassword').value;
  if (pw.length < 12) { toast('主密码至少 12 位', 'error'); return; }
  if (pw !== confirm) { toast('两次输入的密码不一致', 'error'); return; }
  if (localStorage.getItem('haoji_vault')) { toast('检测到已有保险箱，请返回并解锁', 'error'); backToUnlock(); return; }
  state.masterPassword = pw;
  state.keys = [];
  try {
    await saveState();
    document.getElementById('newMasterPassword').value = '';
    document.getElementById('confirmMasterPassword').value = '';
    toast('保险箱创建成功', 'success');
    enterMain();
    resetAutoLock();
  } catch (e) {
    state.masterPassword = '';
    toast('创建失败：浏览器可能不支持安全加密或本地存储', 'error');
  }
}

async function unlockVault() {
  const pw = document.getElementById('masterPasswordInput').value;
  if (!pw) { toast('请输入主密码', 'error'); return; }
  const stored = localStorage.getItem('haoji_vault');
  if (!stored) {
    toast('尚未创建保险箱，请点击“创建保险箱”', 'error');
    return;
  }
  try {
    const data = await decryptData(stored, pw);
    if (!data || !Array.isArray(data.keys)) throw new Error('数据格式无效');
    state.masterPassword = pw;
    state.keys = data.keys.map(normalizeEntry);
    document.getElementById('masterPasswordInput').value = '';
    toast('解锁成功', 'success');
    enterMain();
    resetAutoLock();
  } catch(e) {
    toast('密码错误或数据损坏', 'error');
  }
}

function lockVault() {
  clearTimeout(autoLockTimer);
  state.masterPassword = '';
  state.keys = [];
  state.selected.clear();
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('unlockScreen').style.display = 'flex';
  document.getElementById('masterPasswordInput').value = '';
  document.getElementById('createScreen').style.display = 'none';
  toast('已锁定；剪贴板如曾复制密钥，请手动清除', 'info');
}

async function enterMain() {
  document.getElementById('unlockScreen').style.display = 'none';
  document.getElementById('createScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  renderVault();
}

async function saveState() {
  if (!state.masterPassword) return;
  const encrypted = await encryptData({ keys: state.keys }, state.masterPassword);
  localStorage.setItem('haoji_vault', encrypted);
}

function showAddModal(data) {
  if (data) {
    document.getElementById('modalTitle').textContent = '编辑密钥';
    state.editIndex = state.keys.indexOf(data);
    document.getElementById('keyPlatform').value = data.platform || '';
    document.getElementById('keyValue').value = data.key || '';
    document.getElementById('keyBaseUrl').value = data.baseUrl || '';
    document.getElementById('keyGroup').value = data.group || 'general';
    document.getElementById('keyNote').value = data.note || '';
  } else {
    document.getElementById('modalTitle').textContent = '添加密钥';
    state.editIndex = -1;
    document.getElementById('keyPlatform').value = '';
    document.getElementById('keyValue').value = '';
    document.getElementById('keyBaseUrl').value = '';
    document.getElementById('keyGroup').value = 'general';
    document.getElementById('keyNote').value = '';
  }
  document.getElementById('keyModal').classList.add('show');
}

async function saveKey() {
  const platform = document.getElementById('keyPlatform').value.trim();
  const key = document.getElementById('keyValue').value.trim();
  let baseUrl = document.getElementById('keyBaseUrl').value.trim();
  const group = document.getElementById('keyGroup').value;
  const note = document.getElementById('keyNote').value.trim();
  if (!platform) { toast('请输入平台名称', 'error'); return; }
  if (!key) { toast('请输入 API Key', 'error'); return; }
  if (baseUrl) {
    try {
      const parsed = new URL(baseUrl);
      if (parsed.protocol !== 'https:' && parsed.hostname !== 'localhost' && parsed.hostname !== '127.0.0.1') {
        toast('Base URL 必须使用 HTTPS（本机地址除外）', 'error'); return;
      }
      baseUrl = baseUrl.replace(/\/+$/, '');
    } catch { toast('Base URL 格式无效', 'error'); return; }
  }
  const old = state.editIndex >= 0 ? state.keys[state.editIndex] : null;
  const entry = normalizeEntry({
    id: old ? old.id : (Date.now().toString(36) + Math.random().toString(36).slice(2,8)),
    platform, key, baseUrl, group, note,
    createdAt: old ? old.createdAt : new Date().toISOString(), updatedAt: new Date().toISOString(),
    tested: old && old.key === key && old.baseUrl === baseUrl ? old.tested : false,
    testTime: old && old.key === key && old.baseUrl === baseUrl ? old.testTime : null
  });
  if (state.editIndex >= 0) state.keys[state.editIndex] = entry;
  else state.keys.unshift(entry);
  const wasEdit = state.editIndex >= 0;
  closeModal('keyModal');
  try { await saveState(); renderVault(); toast(wasEdit ? '密钥已更新' : '密钥已添加', 'success'); }
  catch { toast('保存失败：请检查浏览器本地存储空间', 'error'); }
}

async function deleteKey(id) {
  if (!confirm('确定要删除此密钥吗？')) return;
  state.keys = state.keys.filter(k => k.id !== id);
  state.selected.delete(id);
  await saveState();
  renderVault();
  toast('已删除', 'info');
}

function copyKeyById(id) {
  const entry = state.keys.find(k => k.id === id);
  if (entry) copyKey(entry.key);
}

async function copyKey(key) {
  try {
    await navigator.clipboard.writeText(key);
    toast('已复制到剪贴板', 'success');
  } catch {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = key;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('已复制到剪贴板', 'success');
  }
}

function toggleMask(el, id) {
  const entry = state.keys.find(k => k.id === id);
  if (!entry) return;
  const reveal = !el.classList.contains('revealed');
  el.classList.toggle('revealed', reveal);
  el.textContent = reveal ? entry.key : maskKey(entry.key);
}

// Selection
// ============================================================
function toggleSelect(id) {
  if (state.selected.has(id)) state.selected.delete(id);
  else state.selected.add(id);
  updateBulkBar();
  renderVault();
}

function clearSelection() {
  state.selected.clear();
  updateBulkBar();
  renderVault();
}

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const count = state.selected.size;
  document.getElementById('bulkCount').textContent = count;
  bar.classList.toggle('show', count > 0);
}

async function batchDelete() {
  if (state.selected.size === 0) return;
  if (!confirm(`确定要删除选中的 ${state.selected.size} 个密钥吗？`)) return;
  state.keys = state.keys.filter(k => !state.selected.has(k.id));
  state.selected.clear();
  await saveState();
  renderVault();
  updateBulkBar();
  toast('批量删除完成', 'success');
}

// ============================================================
// Connectivity Test
// ============================================================
async function testConnection(entry) {
  let base = (entry.baseUrl || 'https://api.openai.com/v1').trim().replace(/\/+$/, '');
  let parsed;
  try { parsed = new URL(base); } catch { return { success:false, status:null, detail:'Base URL 格式无效' }; }
  if (parsed.protocol !== 'https:' && parsed.hostname !== 'localhost' && parsed.hostname !== '127.0.0.1') {
    return { success:false, status:null, detail:'为保护密钥，拒绝向非 HTTPS 地址发送请求' };
  }
  // Avoid accidentally appending /v1 twice for OpenAI-compatible APIs.
  const endpoint = /\/v1$/i.test(base) ? `${base}/models` : `${base}/v1/models`;
  try {
    const resp = await fetch(endpoint, {
      method: 'GET', headers: { 'Authorization': `Bearer ${entry.key}`, 'Content-Type': 'application/json' },
      signal: AbortSignal.timeout(10000), cache: 'no-store'
    });
    if (resp.ok) return { success:true, status:resp.status, detail:'接口可访问，认证请求已被接受', endpoint };
    if (resp.status === 401 || resp.status === 403) return { success:false, status:resp.status, detail:'服务可访问，但密钥无效或权限不足', endpoint };
    return { success:false, status:resp.status, detail:`服务返回 HTTP ${resp.status}`, endpoint };
  } catch (e) {
    return { success:false, status:null, detail:'请求失败：可能是网络、CORS 或服务端限制；浏览器无法据此确认服务离线' };
  }
}

async function testSingle(entry) {
  const result = await testConnection(entry);
  entry.tested = result.success;
  entry.testTime = new Date().toISOString();
  entry.testResult = result.detail;
  await saveState(); renderVault();
  const suffix = result.status ? `（HTTP ${result.status}）` : '';
  toast(`${entry.platform}：${result.detail}${suffix}`, result.success ? 'success' : 'error');
  return result;
}

async function batchTest() {
  const targets = state.keys.filter(k => state.selected.has(k.id));
  if (targets.length === 0) { toast('请先选择要测试的密钥', 'error'); return; }
  
  const resultsDiv = document.getElementById('testResults');
  resultsDiv.innerHTML = '<div style="text-align:center;padding:20px;"><div class="spinner"></div><p style="margin-top:8px;">正在测试...</p></div>';
  document.getElementById('testModal').classList.add('show');

  const results = [];
  for (const entry of targets) {
    const r = await testConnection(entry);
    entry.tested = r.success;
    entry.testTime = new Date().toISOString();
    entry.testResult = r.detail;
    results.push({ entry, result: r });
  }
  await saveState();
  renderVault();

  let html = '';
  for (const { entry, result } of results) {
    const icon = result.success ? '✅' : '❌';
    const detail = `${result.detail || '测试失败'}${result.status ? `（HTTP ${result.status}）` : ''}`;
    html += `<div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;">
      <span>${icon}</span>
      <div><strong>${escapeHtml(entry.platform)}</strong><br/><span style="font-size:12px;color:var(--text2);">${detail}</span></div>
    </div>`;
  }
  resultsDiv.innerHTML = html;
}

// ============================================================
// Backup
// ============================================================
async function exportBackup() {
  if (!state.masterPassword) { toast('请先解锁保险箱', 'error'); return; }
  if (state.keys.length === 0) { toast('没有密钥可导出', 'error'); return; }
  try {
    const payload = { version:'3.0', exportedAt:new Date().toISOString(), keys:state.keys };
    const encrypted = await encryptData(payload, state.masterPassword);
    const backup = { format:'haoji-encrypted-backup', version:3, kdf:'PBKDF2-SHA-256', cipher:'AES-256-GCM', payload:encrypted };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = `haoji-encrypted-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('加密备份已导出（使用当前主密码保护）', 'success');
  } catch(e) { toast('备份导出失败', 'error'); }
}

async function importBackup(event) {
  const file = event.target.files[0]; if (!file) return;
  try {
    const raw = JSON.parse(await file.text());
    let data;
    if (raw.format === 'haoji-encrypted-backup' && raw.payload) {
      data = await decryptData(raw.payload, state.masterPassword);
    } else {
      if (!confirm('此文件是未加密的旧版备份。导入时文件内容会在浏览器内存中以明文处理，确认继续？')) return;
      data = raw;
    }
    if (!data || !Array.isArray(data.keys)) throw new Error('无效的备份文件格式');
    const existingPlatforms = new Set(state.keys.map(k => String(k.platform).toLowerCase()));
    let added = 0, skipped = 0;
    for (const item of data.keys) {
      if (!item || typeof item.platform !== 'string' || typeof item.key !== 'string' || !item.platform.trim() || !item.key) { skipped++; continue; }
      const platformKey = item.platform.trim().toLowerCase();
      if (existingPlatforms.has(platformKey)) { skipped++; continue; }
      state.keys.push(normalizeEntry(item)); existingPlatforms.add(platformKey); added++;
    }
    await saveState(); renderVault(); toast(`导入完成：新增 ${added} 个，跳过 ${skipped} 个`, 'success');
  } catch(e) { toast(e.message.includes('解密失败') ? '导入失败：备份密码不正确或文件损坏' : `导入失败：${e.message}`, 'error'); }
  finally { event.target.value = ''; }
}

// ============================================================
// Filter & Render
// ============================================================
function setFilter(btn, group) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.filter = group;
  renderVault();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function maskKey(key) {
  if (key.length <= 8) return key.slice(0,4) + '****';
  return key.slice(0,6) + '••••' + key.slice(-4);
}

function renderVault() {
  const grid = document.getElementById('vaultGrid');
  const query = document.getElementById('searchInput').value.toLowerCase().trim();

  let filtered = state.keys.filter(k => {
    if (state.filter && k.group !== state.filter) return false;
    if (query) {
      return k.platform.toLowerCase().includes(query) ||
             (k.note && k.note.toLowerCase().includes(query)) ||
             (k.baseUrl && k.baseUrl.toLowerCase().includes(query));
    }
    return true;
  });

  // Sort
  const sortBy = document.getElementById('sortSelect').value;
  switch (sortBy) {
    case 'newest':
      filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      break;
    case 'oldest':
      filtered.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
      break;
    case 'alpha':
      filtered.sort((a, b) => a.platform.localeCompare(b.platform));
      break;
    case 'tested':
      filtered.sort((a, b) => (b.tested ? 1 : 0) - (a.tested ? 1 : 0));
      break;
  }

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="big-icon">🔑</div>
        <h3>${state.keys.length === 0 ? '还没有密钥' : '没有匹配的密钥'}</h3>
        <p>${state.keys.length === 0 ? '点击上方「添加密钥」开始管理你的 API Key' : '试试其他关键词或分组'}</p>
      </div>`;
  } else {
    grid.innerHTML = filtered.map(k => {
      const isSelected = state.selected.has(k.id);
      const groupLabels = { general:'通用', coding:'编程', drawing:'绘图', work:'工作', personal:'个人', other:'其他' };
      const groupTag = `tag-${k.group}`;
      const timeStr = new Date(k.updatedAt || k.createdAt).toLocaleString('zh-CN', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
      const statusIcon = k.tested ? '<span class="status-dot online"></span>' : '<span class="status-dot unknown"></span>';
      
      return `
      <div class="key-card" style="${isSelected ? 'border-color:var(--primary);' : ''}">
        <div class="top-row">
          <div class="platform">
            <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect('${k.id}')" style="width:16px;height:16px;accent-color:var(--primary);cursor:pointer;" />
            ${escapeHtml(k.platform)}
            <span class="tag ${groupTag}">${groupLabels[k.group] || '其他'}</span>
          </div>
          <div class="actions">
            <button class="btn btn-sm" onclick="showAddModal(state.keys.find(x=>x.id==='${k.id}'))" title="编辑">✏️</button>
            <button class="btn btn-sm btn-success" onclick="testSingle(state.keys.find(x=>x.id==='${k.id}'))" title="测试连通性">🧪</button>
            <button class="btn btn-sm btn-danger" onclick="deleteKey('${k.id}')" title="删除">🗑️</button>
          </div>
        </div>
        <div class="key-value" onclick="copyKeyById('${k.id}')" title="点击复制">
          <span class="masked" onclick="event.stopPropagation();toggleMask(this,'${k.id}')">${escapeHtml(maskKey(k.key))}</span>
          <span style="float:right;font-size:11px;color:var(--text2);">点击复制</span>
        </div>
        ${k.baseUrl ? `<div style="font-size:12px;color:var(--text2);margin-bottom:6px;word-break:break-all;">🌐 ${escapeHtml(k.baseUrl)}</div>` : ''}
        <div class="meta">
          <span title="${escapeHtml(k.testResult || '')}">${statusIcon} ${k.tested ? '测试通过' : (k.testTime ? '测试未通过' : '未测试')}</span>
          <span>🕐 ${timeStr}</span>
        </div>
        ${k.note ? `<div class="note">💬 ${escapeHtml(k.note)}</div>` : ''}
      </div>`;
    }).join('');
  }

  // Update stats
  const platforms = new Set(state.keys.map(k => k.platform.toLowerCase()));
  const groups = new Set(state.keys.map(k => k.group));
  const tested = state.keys.filter(k => k.tested).length;
  document.getElementById('statTotal').textContent = state.keys.length;
  document.getElementById('statPlatforms').textContent = platforms.size;
  document.getElementById('statTested').textContent = tested;
  document.getElementById('statGroups').textContent = groups.size;
}

// ============================================================
function toast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  el.textContent = `${icons[type] || 'ℹ️'} ${msg}`;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 2800);
}

// ============================================================
// Init
// ============================================================
// Check if vault exists
window.addEventListener('DOMContentLoaded', () => {
  const stored = localStorage.getItem('haoji_vault');
  if (stored) {
    document.getElementById('masterPasswordInput').focus();
  } else {
    document.getElementById('masterPasswordInput').focus();
  }
  if (!window.crypto || !crypto.subtle || !window.isSecureContext) {
    toast('提示：Web Crypto 通常要求 HTTPS 或 localhost 环境；请使用安全上下文运行本页面', 'info');
  }
});
</script>
